# ─── Namespace ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: fake-api
---
# ─── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-api-config
  namespace: fake-api
data:
  NODE_ENV: "production"
  PORT: "3000"
  APP_VERSION: "1.0.0"

---
# ─── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-api
  namespace: fake-api
  labels:
    app: fake-api
    version: "1.0.0"
spec:
  # ⚠️  replicas está estático em 1, mas o HPA tem minReplicas: 10
  #     Isso causa conflito: o HPA vai tentar forçar 10 replicas imediatamente.
  replicas: 1
  selector:
    matchLabels:
      app: fake-api
  template:
    metadata:
      labels:
        app: fake-api
        version: "1.0.0"
    spec:
      containers:
      - name: fake-api
        image: kailima/fake-api:latest
          # ⚠️  imagePullPolicy: Always em prod gera latência no startup
          #     e pode falhar se o registry estiver indisponível
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: fake-api-config
        resources:
          requests:
              # ⚠️  1m CPU é insuficiente até para o processo Node.js iniciar.
              #     O scheduler pode colocar o pod em nó saturado e causar
              #     throttling severo desde o primeiro request.
            cpu: "100m"
              # ⚠️  10Mi de RAM: Node.js sozinho consome ~30-50Mi em idle.
              #     O pod vai OOMKill na inicialização.
            memory: "128Mi"
          limits:
              # ⚠️  Limit de CPU igual ao request (1m) elimina qualquer burst
              #     e faz o app travar sob qualquer carga real.
            cpu: "500m"
              # ⚠️  Limit de memória igual ao request: sem headroom nenhum.
              #     Qualquer pico de alocação mata o container.
            memory: "512Mi"
          # ⚠️  Liveness probe com timeout de 1s e failureThreshold: 1
          #     O Kubernetes vai matar o pod na primeira lentidão passageira,
          #     causando restart loops desnecessários.
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 1
          # ⚠️  Readiness probe igual à liveness: pod sai do pool no primeiro
          #     request lento, gerando flapping de endpoints.
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 1
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 1
      # ⚠️  Sem terminationGracePeriodSeconds definido (default 30s),
      #     mas se o app precisar de mais tempo para drenar conexões isso
      #     vai cortar requests em andamento.

---
# ─── Service ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: fake-api
  namespace: fake-api
  labels:
    app: fake-api
spec:
  selector:
    app: fake-api
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
---
# ─── HorizontalPodAutoscaler ──────────────────────────────────────────────────
# ⚠⚠⚠  MÚLTIPLAS CONFIGURAÇÕES PROBLEMÁTICAS ABAIXO  ⚠⚠⚠
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fake-api-hpa
  namespace: fake-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fake-api
  # ⚠️  minReplicas > maxReplicas: configuração inválida.
  #     O Kubernetes rejeita o objeto (validation error).
  #     Na prática isso impede qualquer escalonamento e pode
  #     deixar o Deployment sem controle do HPA.
  minReplicas: 10
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 600   # ⚠️  10 min para aceitar scale-up: muito lento
      policies:
      - type: Pods
        value: 1                         # ⚠️  Sobe apenas 1 pod por vez mesmo sob carga extrema
        periodSeconds: 300               # ⚠️  1 pod a cada 5 minutos
    scaleDown:
      stabilizationWindowSeconds: 0     # ⚠️  Scale-down imediato (sem janela de estabilização)
      policies:
      - type: Percent
        value: 100                       # ⚠️  Pode matar 100% dos pods de uma vez no scale-down
        periodSeconds: 15
---
# ─── Ingress ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fake-api
  namespace: fake-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: fake-api.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fake-api
            port:
              number: 80
